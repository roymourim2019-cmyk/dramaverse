<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dramaverse - Watch K-Drama, C-Drama, Anime & Read Manga</title>
  <link rel="manifest" href="/manifest.json" />
  <style>
    :root {
      --bg-main: #141517;
      --bg-card: #1f2125;
      --accent: #ff6b00;
      --text: #ffffff;
      --text-dim: #a0a0a0;
    }

    [data-theme="light"] {
      --bg-main: #f4f5f7;
      --bg-card: #ffffff;
      --text: #111111;
      --text-dim: #666666;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg-main); color: var(--text); padding-bottom: 50px; }

    header {
      background: #0d0e10;
      padding: 12px 4%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
      flex-wrap: wrap;
      gap: 10px;
    }

    .logo { font-size: 1.5rem; font-weight: 900; color: var(--accent); text-decoration: none; }
    .search-box { position: relative; flex: 1; max-width: 300px; }
    .search-box input { width: 100%; padding: 6px 12px; background: #1f2125; border: 1px solid #333; color: #fff; border-radius: 4px; outline: none; }
    
    .nav-btns { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn { background: none; border: none; color: #fff; padding: 6px 12px; cursor: pointer; font-size: 0.85rem; font-weight: 600; border-radius: 4px; }
    .btn.active, .btn:hover { background: var(--accent); }

    .hero {
      height: 350px;
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: flex-end;
      padding: 30px 4%;
      box-shadow: inset 0 -100px 80px var(--bg-main);
    }
    .hero-title { font-size: 1.8rem; font-weight: 800; background: rgba(0,0,0,0.6); padding: 6px 12px; border-radius: 4px; color: #fff; }

    .grid-container { padding: 20px 4%; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; margin-top: 15px; }

    .card { background: var(--bg-card); border-radius: 6px; overflow: hidden; cursor: pointer; border: 1px solid rgba(255,255,255,0.05); }
    .thumb { width: 100%; aspect-ratio: 16/9; position: relative; background: #222; }
    .thumb img { width: 100%; height: 100%; object-fit: cover; }
    .badge { position: absolute; bottom: 5px; right: 5px; background: rgba(0,0,0,0.8); color: #fff; font-size: 0.7rem; padding: 2px 6px; border-radius: 3px; }
    .card-title { padding: 8px; font-size: 0.85rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Player Overlay */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 2000; align-items: center; justify-content: center; padding: 20px; }
    .modal.active { display: flex; }
    .modal-box { background: var(--bg-card); width: 100%; max-width: 900px; padding: 20px; border-radius: 8px; position: relative; max-height: 90vh; overflow-y: auto; }
    .close-btn { position: absolute; top: 10px; right: 15px; background: none; border: none; color: var(--text); font-size: 1.2rem; cursor: pointer; }
    iframe { width: 100%; height: 450px; border: none; border-radius: 6px; margin-top: 10px; }

    .controls-row { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
    .controls-row select, .controls-row button { padding: 6px 12px; background: var(--bg-main); color: var(--text); border: 1px solid #444; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>

  <header>
    <a href="#" class="logo">DRAMAVERSE</a>
    
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search show or anime..." onkeyup="handleSearch(event)">
    </div>

    <div class="nav-btns">
      <button class="btn active" onclick="loadCategory('kdrama')">K-Drama</button>
      <button class="btn" onclick="loadCategory('cdrama')">C-Drama</button>
      <button class="btn" onclick="loadCategory('anime')">Anime</button>
      <button class="btn" onclick="loadCategory('manga')">Manga</button>
      <button class="btn" onclick="openModal('requestModal')">📝 Request</button>
      <button class="btn" onclick="openModal('faqModal')">💬 FAQ</button>
      <button class="btn" onclick="toggleTheme()">🎨 Theme</button>
    </div>
  </header>

  <div class="hero" id="heroBanner" style="background-image: url('https://image.tmdb.org/t/p/original/8Y4P1A3444I.jpg');">
    <div class="hero-title" id="heroTitle">Featured Releases</div>
  </div>

  <div class="grid-container">
    <h2 id="sectionHeading">Latest Updates</h2>
    <div class="grid" id="mainGrid">
      <p style="color: var(--text-dim);">Loading titles...</p>
    </div>
  </div>

  <!-- Player & Streaming Controls -->
  <div class="modal" id="playerModal">
    <div class="modal-box">
      <button class="close-btn" onclick="closeModal('playerModal')">✕</button>
      <h3 id="playerTitle">Streaming</h3>

      <div class="controls-row">
        <label>Server:
          <select id="serverSelect" onchange="updatePlayerSource()">
            <option value="vidsrc">Server 1 (VidSrc)</option>
            <option value="autoembed">Server 2 (AutoEmbed)</option>
            <option value="2embed">Server 3 (2Embed)</option>
          </select>
        </label>

        <label>Episode:
          <select id="episodeSelect" onchange="updatePlayerSource()">
            <!-- Episode options populating dynamically -->
          </select>
        </label>
      </div>

      <iframe id="videoIframe" src="" allowfullscreen></iframe>
    </div>
  </div>

  <!-- FAQ Modal -->
  <div class="modal" id="faqModal">
    <div class="modal-box">
      <button class="close-btn" onclick="closeModal('faqModal')">✕</button>
      <h3>Frequently Asked Questions</h3>
      <p style="color: var(--text-dim); margin-top: 10px;">
        <b>Q: Why is a video buffering?</b><br>
        A: Use the "Server" dropdown above the video player to switch to an alternate streaming server.
      </p>
    </div>
  </div>

  <!-- Request Modal -->
  <div class="modal" id="requestModal">
    <div class="modal-box">
      <button class="close-btn" onclick="closeModal('requestModal')">✕</button>
      <h3>Request a Title</h3>
      <input type="text" id="reqInput" placeholder="Enter drama or anime name..." style="width: 100%; padding: 8px; margin: 15px 0; background: var(--bg-main); color: var(--text); border: 1px solid rgba(255,255,255,0.1);">
      <button onclick="submitReq()" style="background: var(--accent); color: #fff; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer;">Submit Request</button>
    </div>
  </div>

  <script>
    const TMDB_KEY = '3fd2be6f0c70a2a598f084dd149488e0';
    let currentItem = { id: null, type: null, title: '' };

    document.addEventListener("DOMContentLoaded", () => {
      loadCategory('kdrama');
    });

    function toggleTheme() {
      const body = document.body;
      body.setAttribute('data-theme', body.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
    }

    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { 
      document.getElementById(id).classList.remove('active');
      if(id === 'playerModal') document.getElementById('videoIframe').src = '';
    }

    function submitReq() {
      const val = document.getElementById('reqInput').value;
      if(val) {
        alert(`Request submitted for: "${val}"`);
        closeModal('requestModal');
      }
    }

    async function loadCategory(cat) {
      const grid = document.getElementById('mainGrid');
      grid.innerHTML = '<p style="color: var(--text-dim);">Loading titles...</p>';

      if (cat === 'kdrama' || cat === 'cdrama') {
        const lang = cat === 'kdrama' ? 'ko' : 'zh';
        document.getElementById('sectionHeading').innerText = cat === 'kdrama' ? 'Top K-Dramas' : 'Top C-Dramas';
        fetchTMDB(`https://api.themoviedb.org/3/discover/tv?api_key=${TMDB_KEY}&with_original_language=${lang}&sort_by=popularity.desc`);
      } else if (cat === 'anime') {
        document.getElementById('sectionHeading').innerText = 'Popular Anime';
        fetchAnime();
      } else if (cat === 'manga') {
        document.getElementById('sectionHeading').innerText = 'Manga Reader';
        fetchManga();
      }
    }

    async function handleSearch(e) {
      const query = e.target.value.trim();
      if(query.length < 3) return;

      const grid = document.getElementById('mainGrid');
      document.getElementById('sectionHeading').innerText = `Search results for: "${query}"`;
      
      const res = await fetch(`https://api.themoviedb.org/3/search/tv?api_key=${TMDB_KEY}&query=${encodeURIComponent(query)}`);
      const data = await res.json();
      
      grid.innerHTML = data.results.map(item => `
        <div class="card" onclick="setupPlayer('${item.id}', 'tv', '${item.name || item.title}')">
          <div class="thumb">
            <img src="${item.backdrop_path ? 'https://image.tmdb.org/t/p/w500' + item.backdrop_path : 'https://image.tmdb.org/t/p/w500' + item.poster_path}">
            <span class="badge">EP 1</span>
          </div>
          <div class="card-title">${item.name || item.title}</div>
        </div>
      `).join('');
    }

    async function fetchTMDB(url) {
      const res = await fetch(url);
      const data = await res.json();
      const grid = document.getElementById('mainGrid');

      if (data.results[0]) {
        document.getElementById('heroBanner').style.backgroundImage = `url(https://image.tmdb.org/t/p/original${data.results[0].backdrop_path})`;
        document.getElementById('heroTitle').innerText = data.results[0].name || data.results[0].title;
      }

      grid.innerHTML = data.results.map(item => `
        <div class="card" onclick="setupPlayer('${item.id}', 'tv', '${item.name || item.title}')">
          <div class="thumb">
            <img src="${item.backdrop_path ? 'https://image.tmdb.org/t/p/w500' + item.backdrop_path : 'https://image.tmdb.org/t/p/w500' + item.poster_path}">
            <span class="badge">EP 1</span>
          </div>
          <div class="card-title">${item.name || item.title}</div>
        </div>
      `).join('');
    }

    async function fetchAnime() {
      const res = await fetch('https://api.jikan.moe/v4/top/anime');
      const data = await res.json();
      const grid = document.getElementById('mainGrid');

      grid.innerHTML = data.data.map(item => `
        <div class="card" onclick="setupPlayer('${item.mal_id}', 'anime', '${item.title}')">
          <div class="thumb">
            <img src="${item.images.jpg.large_image_url}">
            <span class="badge">EPS ${item.episodes || '?'}</span>
          </div>
          <div class="card-title">${item.title}</div>
        </div>
      `).join('');
    }

    async function fetchManga() {
      const res = await fetch('https://api.jikan.moe/v4/top/manga');
      const data = await res.json();
      const grid = document.getElementById('mainGrid');

      grid.innerHTML = data.data.map(item => `
        <div class="card" onclick="openManga('${item.title}')">
          <div class="thumb">
            <img src="${item.images.jpg.large_image_url}">
            <span class="badge">MANGA</span>
          </div>
          <div class="card-title">${item.title}</div>
        </div>
      `).join('');
    }

    function setupPlayer(id, type, title) {
      currentItem = { id, type, title };
      document.getElementById('playerTitle').innerText = title;

      // Populate Episode Selector (1 to 24)
      const epSelect = document.getElementById('episodeSelect');
      epSelect.innerHTML = '';
      for (let i = 1; i <= 24; i++) {
        const opt = document.createElement('option');
        opt.value = i;
        opt.innerText = `Episode ${i}`;
        epSelect.appendChild(opt);
      }

      updatePlayerSource();
      openModal('playerModal');
    }

    function updatePlayerSource() {
      const server = document.getElementById('serverSelect').value;
      const ep = document.getElementById('episodeSelect').value;
      const iframe = document.getElementById('videoIframe');

      if (currentItem.type === 'anime') {
        iframe.src = `https://vidsrc.to/embed/anime/${currentItem.id}/${ep}`;
      } else {
        if (server === 'vidsrc') {
          iframe.src = `https://vidsrc.to/embed/tv/${currentItem.id}/1/${ep}`;
        } else if (server === 'autoembed') {
          iframe.src = `https://player.autoembed.cc/embed/tv/${currentItem.id}/1/${ep}`;
        } else {
          iframe.src = `https://www.2embed.cc/embedtv/${currentItem.id}&s=1&e=${ep}`;
        }
      }
    }

    function openManga(title) {
      const iframe = document.getElementById('videoIframe');
      iframe.src = `https://mangadex.org/titles?q=${encodeURIComponent(title)}`;
      openModal('playerModal');
    }
  </script>
</body>
</html>
