<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dramaverse - Watch K-Drama, C-Drama, Anime & Read Manga</title>
  <link rel="manifest" href="/manifest.json" />
  <style>
    :root {
      --bg-main: #141517;
      --bg-card: #1f2125;
      --accent: #ff6b00;
      --text: #ffffff;
      --text-dim: #a0a0a0;
    }

    [data-theme="light"] {
      --bg-main: #f4f5f7;
      --bg-card: #ffffff;
      --text: #111111;
      --text-dim: #666666;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: var(--bg-main); color: var(--text); padding-bottom: 50px; }

    header {
      background: #0d0e10;
      padding: 12px 4%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .logo { font-size: 1.5rem; font-weight: 900; color: var(--accent); text-decoration: none; }
    .nav-btns { display: flex; gap: 8px; }
    .btn { background: none; border: none; color: #fff; padding: 6px 12px; cursor: pointer; font-size: 0.85rem; font-weight: 600; border-radius: 4px; }
    .btn.active, .btn:hover { background: var(--accent); }

    .hero {
      height: 350px;
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: flex-end;
      padding: 30px 4%;
      box-shadow: inset 0 -100px 80px var(--bg-main);
    }
    .hero-title { font-size: 1.8rem; font-weight: 800; background: rgba(0,0,0,0.6); padding: 6px 12px; border-radius: 4px; color: #fff; }

    .grid-container { padding: 20px 4%; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 15px; margin-top: 15px; }

    .card { background: var(--bg-card); border-radius: 6px; overflow: hidden; cursor: pointer; border: 1px solid rgba(255,255,255,0.05); }
    .thumb { width: 100%; aspect-ratio: 16/9; position: relative; background: #222; }
    .thumb img { width: 100%; height: 100%; object-fit: cover; }
    .badge { position: absolute; bottom: 5px; right: 5px; background: rgba(0,0,0,0.8); color: #fff; font-size: 0.7rem; padding: 2px 6px; border-radius: 3px; }
    .card-title { padding: 8px; font-size: 0.85rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 2000; align-items: center; justify-content: center; padding: 20px; }
    .modal.active { display: flex; }
    .modal-box { background: var(--bg-card); width: 100%; max-width: 800px; padding: 20px; border-radius: 8px; position: relative; }
    .close-btn { position: absolute; top: 10px; right: 15px; background: none; border: none; color: var(--text); font-size: 1.2rem; cursor: pointer; }
    iframe { width: 100%; height: 450px; border: none; }
  </style>
</head>
<body>

  <header>
    <a href="#" class="logo">DRAMAVERSE</a>
    <div class="nav-btns">
      <button class="btn active" onclick="loadCategory('kdrama')">K-Drama</button>
      <button class="btn" onclick="loadCategory('cdrama')">C-Drama</button>
      <button class="btn" onclick="loadCategory('anime')">Anime</button>
      <button class="btn" onclick="loadCategory('manga')">Manga</button>
      <button class="btn" onclick="openModal('requestModal')">📝 Request</button>
      <button class="btn" onclick="openModal('faqModal')">💬 FAQ</button>
      <button class="btn" onclick="toggleTheme()">🎨 Theme</button>
    </div>
  </header>

  <div class="hero" id="heroBanner" style="background-image: url('https://image.tmdb.org/t/p/original/8Y4P1A3444I.jpg');">
    <div class="hero-title" id="heroTitle">Featured Releases</div>
  </div>

  <div class="grid-container">
    <h2 id="sectionHeading">Latest Updates</h2>
    <div class="grid" id="mainGrid">
      <p style="color: var(--text-dim);">Loading titles...</p>
    </div>
  </div>

  <!-- Player Modal -->
  <div class="modal" id="playerModal">
    <div class="modal-box">
      <button class="close-btn" onclick="closeModal('playerModal')">✕</button>
      <iframe id="videoIframe" src="" allowfullscreen></iframe>
    </div>
  </div>

  <!-- FAQ Modal -->
  <div class="modal" id="faqModal">
    <div class="modal-box">
      <button class="close-btn" onclick="closeModal('faqModal')">✕</button>
      <h3>Frequently Asked Questions</h3>
      <p style="color: var(--text-dim); margin-top: 10px;"><b>Q: How do I stream episodes?</b><br>Click any media card to launch the embedded video player.</p>
    </div>
  </div>

  <!-- Request Modal -->
  <div class="modal" id="requestModal">
    <div class="modal-box">
      <button class="close-btn" onclick="closeModal('requestModal')">✕</button>
      <h3>Request a Title</h3>
      <input type="text" id="reqInput" placeholder="Enter drama or anime name..." style="width: 100%; padding: 8px; margin: 15px 0; background: var(--bg-main); color: var(--text); border: 1px solid rgba(255,255,255,0.1);">
      <button onclick="submitReq()" style="background: var(--accent); color: #fff; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer;">Submit Request</button>
    </div>
  </div>

  <script>
    const TMDB_KEY = '3fd2be6f0c70a2a598f084dd149488e0';

    document.addEventListener("DOMContentLoaded", () => {
      loadCategory('kdrama');
    });

    function toggleTheme() {
      const body = document.body;
      body.setAttribute('data-theme', body.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
    }

    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { 
      document.getElementById(id).classList.remove('active');
      if(id === 'playerModal') document.getElementById('videoIframe').src = '';
    }

    function submitReq() {
      const val = document.getElementById('reqInput').value;
      if(val) {
        alert(`Request received for: "${val}"`);
        closeModal('requestModal');
      }
    }

    async function loadCategory(cat) {
      const grid = document.getElementById('mainGrid');
      grid.innerHTML = '<p style="color: var(--text-dim);">Loading...</p>';

      if (cat === 'kdrama' || cat === 'cdrama') {
        const lang = cat === 'kdrama' ? 'ko' : 'zh';
        document.getElementById('sectionHeading').innerText = cat === 'kdrama' ? 'Top K-Dramas' : 'Top C-Dramas';
        fetchTMDB(`https://api.themoviedb.org/3/discover/tv?api_key=${TMDB_KEY}&with_original_language=${lang}&sort_by=popularity.desc`);
      } else if (cat === 'anime') {
        document.getElementById('sectionHeading').innerText = 'Popular Anime';
        fetchAnime();
      } else if (cat === 'manga') {
        document.getElementById('sectionHeading').innerText = 'Manga Reader';
        fetchManga();
      }
    }

    async function fetchTMDB(url) {
      const res = await fetch(url);
      const data = await res.json();
      const grid = document.getElementById('mainGrid');

      if (data.results[0]) {
        document.getElementById('heroBanner').style.backgroundImage = `url(https://image.tmdb.org/t/p/original${data.results[0].backdrop_path})`;
        document.getElementById('heroTitle').innerText = data.results[0].name || data.results[0].title;
      }

      grid.innerHTML = data.results.map(item => `
        <div class="card" onclick="playMedia('${item.id}', 'tv')">
          <div class="thumb">
            <img src="${item.backdrop_path ? 'https://image.tmdb.org/t/p/w500' + item.backdrop_path : 'https://image.tmdb.org/t/p/w500' + item.poster_path}">
            <span class="badge">EP 1</span>
          </div>
          <div class="card-title">${item.name || item.title}</div>
        </div>
      `).join('');
    }

    async function fetchAnime() {
      const res = await fetch('https://api.jikan.moe/v4/top/anime');
      const data = await res.json();
      const grid = document.getElementById('mainGrid');

      grid.innerHTML = data.data.map(item => `
        <div class="card" onclick="playMedia('${item.mal_id}', 'anime')">
          <div class="thumb">
            <img src="${item.images.jpg.large_image_url}">
            <span class="badge">EPS ${item.episodes || '?'}</span>
          </div>
          <div class="card-title">${item.title}</div>
        </div>
      `).join('');
    }

    async function fetchManga() {
      const res = await fetch('https://api.jikan.moe/v4/top/manga');
      const data = await res.json();
      const grid = document.getElementById('mainGrid');

      grid.innerHTML = data.data.map(item => `
        <div class="card" onclick="openManga('${item.title}')">
          <div class="thumb">
            <img src="${item.images.jpg.large_image_url}">
            <span class="badge">MANGA</span>
          </div>
          <div class="card-title">${item.title}</div>
        </div>
      `).join('');
    }

    function playMedia(id, type) {
      const iframe = document.getElementById('videoIframe');
      iframe.src = type === 'anime' ? `https://vidsrc.to/embed/anime/${id}` : `https://vidsrc.to/embed/tv/${id}`;
      openModal('playerModal');
    }

    function openManga(title) {
      const iframe = document.getElementById('videoIframe');
      iframe.src = `https://mangadex.org/titles?q=${encodeURIComponent(title)}`;
      openModal('playerModal');
    }
  </script>
</body>
</html>
