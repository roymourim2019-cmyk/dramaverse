<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Media Engine</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #0b0c10; color: #c5c6c7; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; }
        .container { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 15px; }
        .search-panel { background: #1f2833; padding: 15px; border-radius: 10px; border: 1px solid #45a29e; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
        .search-panel input { flex: 1; min-width: 200px; padding: 10px 14px; background: #0b0c10; border: 1px solid #45a29e; color: #fff; border-radius: 6px; outline: none; }
        .search-panel select, .search-panel button { padding: 10px 14px; background: #45a29e; color: #0b0c10; border: none; font-weight: bold; border-radius: 6px; cursor: pointer; }
        .search-panel select { background: #0b0c10; color: #fff; border: 1px solid #45a29e; }
        .results-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; max-height: 250px; overflow-y: auto; background: #121212; padding: 10px; border-radius: 8px; border: 1px solid #222; }
        .card { background: #1f2833; border-radius: 6px; overflow: hidden; cursor: pointer; transition: transform 0.2s, border 0.2s; border: 2px solid transparent; }
        .card:hover { transform: scale(1.03); border-color: #66fcf1; }
        .card img { width: 100%; height: 160px; object-fit: cover; }
        .card .title { font-size: 11px; padding: 6px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
        .controls-bar { background: #1f2833; padding: 10px 15px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .ep-controls { display: flex; gap: 8px; align-items: center; font-size: 12px; }
        .ep-controls input { width: 50px; padding: 4px 8px; background: #0b0c10; border: 1px solid #45a29e; color: #fff; border-radius: 4px; text-align: center; }
        .btn-action { background: #0b0c10; color: #66fcf1; border: 1px solid #45a29e; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-action:hover { background: #45a29e; color: #0b0c10; }
        .player-wrapper { width: 100%; height: 620px; background: #000; border-radius: 10px; overflow: hidden; border: 1px solid #45a29e; position: relative; }
        iframe { width: 100%; height: 100%; border: none; }
        .placeholder { display: flex; height: 100%; align-items: center; justify-content: center; color: #66fcf1; font-size: 14px; text-align: center; padding: 20px; }
    </style>
</head>
<body>

<div class="container">
    <div class="search-panel">
        <input type="text" id="search-input" placeholder="Search Movies, TV Dramas, Anime, Manga...">
        <select id="type-select">
            <option value="movie">Movie (TMDB)</option>
            <option value="tv">TV / Drama (TMDB)</option>
            <option value="anime">Anime (Jikan/MAL)</option>
            <option value="manga">Manga (Comick)</option>
        </select>
        <button onclick="executeSearch()">Search Catalog</button>
    </div>

    <div id="results-grid" class="results-grid" style="display:none;"></div>

    <div class="controls-bar">
        <div class="ep-controls">
            <button class="btn-action" onclick="changeEpisode(-1)">&laquo; Prev</button>
            <label>Season:</label> <input type="number" id="season-num" value="1" min="1" onchange="updateStream()">
            <label>Ep/Ch:</label> <input type="number" id="ep-num" value="1" min="1" onchange="updateStream()">
            <button class="btn-action" onclick="changeEpisode(1)">Next &raquo;</button>
        </div>
        <div>
            <label style="font-size: 12px;">Provider:</label>
            <select id="provider-select" onchange="changeProvider()"></select>
        </div>
    </div>

    <div class="player-wrapper">
        <div id="player-placeholder" class="placeholder">
            Search for a title above and click a poster to load playback.
        </div>
        <iframe id="engine-iframe" 
                allowfullscreen="true" 
                scrolling="yes" 
                allow="autoplay; encrypted-media; picture-in-picture"
                sandbox="allow-scripts allow-same-origin allow-forms allow-presentation"
                style="display:none;">
        </iframe>
    </div>
</div>

<script>
    const TMDB_KEY = "3b607ead7c605453b15913b551271420";
    let activeMedia = { id: null, type: 'movie' };

    window.addEventListener('DOMContentLoaded', () => {
        const saved = JSON.parse(localStorage.getItem('engine_last_session'));
        if (saved && saved.activeMedia?.id) {
            activeMedia = saved.activeMedia;
            document.getElementById('season-num').value = saved.season || 1;
            document.getElementById('ep-num').value = saved.ep || 1;
            updateStream(false);
        }
    });

    function saveProgress() {
        const season = document.getElementById('season-num').value;
        const ep = document.getElementById('ep-num').value;
        localStorage.setItem('engine_last_session', JSON.stringify({ activeMedia, season, ep }));
    }

    function getProviders(type, id, season, ep) {
        switch(type) {
            case "movie":
                return [
                    { name: "VidSrc CC", url: `https://vidsrc.cc/v2/embed/movie/${id}` },
                    { name: "AutoEmbed", url: `https://player.autoembed.cc/embed/movie/${id}` },
                    { name: "2Embed", url: `https://www.2embed.cc/embed/${id}` }
                ];
            case "tv":
                return [
                    { name: "VidSrc CC", url: `https://vidsrc.cc/v2/embed/tv/${id}/${season}/${ep}` },
                    { name: "AutoEmbed", url: `https://player.autoembed.cc/embed/tv/${id}/${season}/${ep}` },
                    { name: "2Embed", url: `https://www.2embed.cc/embedtv/${id}&s=${season}&e=${ep}` }
                ];
            case "anime":
                return [
                    { name: "VidSrc Anime", url: `https://vidsrc.cc/v2/embed/anime/${id}/${season}/${ep}` },
                    { name: "2Embed Anime", url: `https://www.2embed.cc/embed/${id}` }
                ];
            case "manga":
                return [
                    { name: "Comick IO", url: `https://comick.io/comic/${id}/chapter-${ep}-en` },
                    { name: "MangaDex Direct", url: `https://mangadex.org/title/${id}` }
                ];
        }
    }

    async function executeSearch() {
        const query = document.getElementById('search-input').value;
        const type = document.getElementById('type-select').value;
        const grid = document.getElementById('results-grid');
        
        if (!query) return;
        grid.style.display = 'grid';
        grid.innerHTML = '<div style="color:#aaa; font-size:12px;">Searching catalog...</div>';

        try {
            if (type === 'anime') {
                const res = await fetch(`https://api.jikan.moe/v4/anime?q=${encodeURIComponent(query)}&limit=10`);
                const data = await res.json();
                renderGrid(data.data.map(i => ({ id: i.mal_id, title: i.title, poster: i.images.jpg.image_url, type: 'anime' })));
            } else if (type === 'manga') {
                const res = await fetch(`https://api.comick.fun/v1.0/search?q=${encodeURIComponent(query)}&limit=10`);
                const data = await res.json();
                renderGrid(data.map(i => ({ id: i.slug, title: i.title, poster: i.cover_url || 'https://via.placeholder.com/150', type: 'manga' })));
            } else {
                const endpoint = type === 'movie' ? 'movie' : 'tv';
                const res = await fetch(`https://api.themoviedb.org/3/search/${endpoint}?api_key=${TMDB_KEY}&query=${encodeURIComponent(query)}`);
                const data = await res.json();
                renderGrid(data.results.map(i => ({ id: i.id, title: i.title || i.name, poster: i.poster_path ? `https://image.tmdb.org/t/p/w200${i.poster_path}` : 'https://via.placeholder.com/150', type: type })));
            }
        } catch (err) {
            grid.innerHTML = '<div style="color:red; font-size:12px;">Search failed. Please try again.</div>';
        }
    }

    function renderGrid(items) {
        const grid = document.getElementById('results-grid');
        if(!items.length) { grid.innerHTML = '<div style="color:#aaa; font-size:12px;">No results found.</div>'; return; }
        
        grid.innerHTML = items.map(i => `
            <div class="card" onclick="selectMedia('${i.id}', '${i.type}')">
                <img src="${i.poster}" alt="${i.title}">
                <div class="title">${i.title}</div>
            </div>
        `).join('');
    }

    function selectMedia(id, type) {
        activeMedia = { id, type };
        document.getElementById('results-grid').style.display = 'none';
        updateStream(true);
    }

    function changeEpisode(delta) {
        const epInput = document.getElementById('ep-num');
        let current = parseInt(epInput.value) || 1;
        if (current + delta >= 1) {
            epInput.value = current + delta;
            updateStream(true);
        }
    }

    function updateStream(shouldSave = true) {
        if (!activeMedia.id) return;

        const season = document.getElementById('season-num').value;
        const ep = document.getElementById('ep-num').value;
        const providers = getProviders(activeMedia.type, activeMedia.id, season, ep);
        
        const providerSelect = document.getElementById('provider-select');
        providerSelect.innerHTML = providers.map(p => `<option value="${p.url}">${p.name}</option>`).join('');

        const iframe = document.getElementById('engine-iframe');
        document.getElementById('player-placeholder').style.display = 'none';
        iframe.style.display = 'block';
        iframe.src = providers[0].url;

        if (shouldSave) saveProgress();
    }

    function changeProvider() {
        document.getElementById('engine-iframe').src = document.getElementById('provider-select').value;
    }

    document.addEventListener('keydown', (e) => {
        if (document.activeElement.tagName === 'INPUT') return;
        if (e.key === 'N' || e.key === 'n') changeEpisode(1);
        if (e.key === 'P' || e.key === 'p') changeEpisode(-1);
    });
</script>
</body>
</html>
